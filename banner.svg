<svg width="100%" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1726"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Ambient Cyan Glow -->
    <radialGradient id="cyanGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.12"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <!-- Subtle Scanline / Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.03); }
    }
    @keyframes beacon {
      0%, 100% { opacity: 1; r: 4px; }
      50% { opacity: 0.4; r: 6px; }
    }
    @keyframes borderPulse {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.7; }
    }
    .grid-bg { opacity: 0.65; }
    .status-text { font-family: 'Fira Code', monospace, -apple-system, sans-serif; font-size: 12px; letter-spacing: 1.5px; fill: #7dd3fc; }
    .name-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif; font-weight: 800; font-size: 52px; letter-spacing: -0.5px; fill: url(#textGrad); }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif; font-weight: 400; font-size: 18px; fill: #94a3b8; letter-spacing: 0.5px; }
    .accent-tag { font-family: 'Fira Code', monospace, sans-serif; font-size: 13px; fill: #38bdf8; font-weight: 500; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="260" rx="14" fill="url(#bgGradient)"/>
  
  <!-- Subtle Border with Cyan Accent -->
  <rect width="1198" height="258" x="1" y="1" rx="13" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" style="animation: borderPulse 4s infinite ease-in-out;"/>

  <!-- Background Tech Grid -->
  <rect width="1200" height="260" rx="14" fill="url(#grid)" class="grid-bg"/>

  <!-- Radial Ambient Light -->
  <rect width="1200" height="260" rx="14" fill="url(#cyanGlow)"/>

  <!-- Top Status Pill -->
  <g transform="translate(600, 48)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0c2338" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="-115" cy="0" r="4.5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="5" y="4" text-anchor="middle" class="status-text">AVAILABLE FOR COLLAB</text>
  </g>

  <!-- Main Name Title -->
  <text x="600" y="128" text-anchor="middle" class="name-title" filter="url(#glow)">Prakash Kavyaraj</text>

  <!-- Subtitle -->
  <text x="600" y="168" text-anchor="middle" class="subtitle">
    CS &amp; Business Systems Student <tspan fill="#38bdf8">|</tspan> C++ Systems <tspan fill="#38bdf8">|</tspan> Modern Frontend Architect
  </text>

  <!-- Tech Focus Badges Bar -->
  <g transform="translate(600, 212)">
    <!-- Pill 1: C++ -->
    <g transform="translate(-230, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="0" y="4" text-anchor="middle" class="accent-tag">⚡ C++ Core</text>
    </g>
    <!-- Pill 2: React / Next.js -->
    <g transform="translate(-75, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="0" y="4" text-anchor="middle" class="accent-tag">⚛️ React / Next.js</text>
    </g>
    <!-- Pill 3: Creative UI -->
    <g transform="translate(85, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="0" y="4" text-anchor="middle" class="accent-tag">🎨 Modern UI/UX</text>
    </g>
    <!-- Pill 4: GenAI / Web3 -->
    <g transform="translate(235, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="0" y="4" text-anchor="middle" class="accent-tag">🚀 AI &amp; Web3</text>
    </g>
  </g>
</svg>
